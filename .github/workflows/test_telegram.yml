name: Telegram Broadcast Dispatch

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Broadcast Eylemi (broadcast_22, apology_and_reports veya test)'
        required: true
        default: 'broadcast_22'
        type: choice
        options:
          - broadcast_22
          - apology_and_reports
          - test

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Dispatch Broadcast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.action }}" = "test" ]; then
            python -m src.agents.broadcaster --test
          elif [ "${{ inputs.action }}" = "broadcast_22" ]; then
            python -m src.agents.broadcaster --broadcast-date 2026-10-22
          else
            python -m src.agents.broadcaster --apology-and-reports
          fi
