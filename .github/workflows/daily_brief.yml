name: Daily AI Intelligence Brief

on:
  schedule:
    # Runs daily at UTC 04:00 (07:00 AM Turkish Time / UTC+3)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      language:
        description: 'Bülten Dili (Report Language)'
        required: true
        default: 'tr'
        type: choice
        options:
          - tr
          - en
      date:
        description: 'Rapor Tarihi (YYYY-MM-DD, boş bırakılırsa bugün)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Intelligence Pipeline
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURATOR_MODEL: ${{ secrets.CURATOR_MODEL || 'gemini-3.8-flash' }}
          ANALYST_MODEL: ${{ secrets.ANALYST_MODEL || 'gemini-3.8-flash' }}
          REPORT_LANGUAGE: ${{ inputs.language || secrets.REPORT_LANGUAGE || 'tr' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python main.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }} --lang ${{ inputs.language || secrets.REPORT_LANGUAGE || 'tr' }}

      - name: Commit and Push Report
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL || secrets.GIT_USER_EMAIL || secrets.EMAIL || secrets.GIT_EMAIL || secrets.GH_EMAIL }}
          USER_NAME: ${{ secrets.USER_NAME || secrets.GIT_USER_NAME || secrets.GH_USER || 'hamzamalikyildiz' }}
        run: |
          git config --local user.email "${USER_EMAIL:-action@github.com}"
          git config --local user.name "${USER_NAME:-hamzamalikyildiz}"
          git add reports/ README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(report): auto-generate brief for $(date +'%Y-%m-%d')" && git push)

      - name: Post-Publish Verification (Auditor Agent)
        run: |
          python -m src.agents.auditor --latest --strict
